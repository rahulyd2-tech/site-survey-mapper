<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Site Survey Mapper</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <button class="brand" id="brand-button" title="Field check-in">
      <img class="brand-logo" src="assets/logo-aoa.png" alt="Age of Aquarius India Developers LLP" />
      <span class="brand-title">Site Survey Mapper</span>
    </button>
    <img class="partner-logo" src="assets/logo-dmlrd.png" alt="DMLRD Tech" onerror="this.style.display='none'" />
  </header>

  <main id="view-root"></main>

  <nav class="bottom-nav">
    <button data-view="dashboard" class="active"><span class="icon">🗺️</span><span>Map</span></button>
    <button data-view="new-entry" class="fab"><span class="icon">＋</span><span>New</span></button>
    <button data-view="sync">
      <span class="icon-wrap">
        <span class="icon">⇅</span>
        <span id="sync-badge" class="nav-badge ok" title="Sync status"></span>
      </span>
      <span>Sync</span>
    </button>
  </nav>

  <div id="checkin-overlay" class="modal-overlay checkin-overlay" hidden>
    <div class="modal-card checkin-card">
      <div class="checkin-header">
        <img class="checkin-logo" src="assets/logo-aoa.png" alt="" />
        <div>
          <h2>Field Check-In</h2>
          <p class="modal-sub">Verify your identity to start this session.</p>
        </div>
      </div>

      <div class="camera-frame">
        <video id="checkin-video" autoplay playsinline muted></video>
        <canvas id="checkin-canvas" hidden></canvas>
        <div id="checkin-camera-status" class="camera-status">Starting camera…</div>
      </div>

      <div class="field-group">
        <label>Employee code <span class="required">*</span></label>
        <input id="way-employee-id" type="text" placeholder="e.g. AOAID0103" autocomplete="off" autocapitalize="characters" />
      </div>
      <div class="field-group">
        <label>Password <span class="required">*</span></label>
        <input id="way-password" type="password" placeholder="Password" autocomplete="off" />
      </div>
      <div class="field-group">
        <label>Project / site name</label>
        <input id="way-project" type="text" placeholder="e.g. Purandar Site — Plot 4" autocomplete="off" />
      </div>

      <div id="checkin-error" class="hint error"></div>
      <button id="way-save" class="btn-primary" disabled>Check In</button>
      <button id="way-admin-link" class="link-button" type="button">Admin login</button>
    </div>
  </div>

  <div id="admin-login-overlay" class="modal-overlay" hidden>
    <div class="modal-card">
      <h2>Admin Login</h2>
      <p class="modal-sub">Restricted to authorized administrators.</p>

      <div class="field-group">
        <label>Employee code <span class="required">*</span></label>
        <input id="admin-login-id" type="text" placeholder="Employee code" autocomplete="off" autocapitalize="characters" />
      </div>
      <div class="field-group">
        <label>Password <span class="required">*</span></label>
        <input id="admin-login-password" type="password" placeholder="Password" autocomplete="off" />
      </div>

      <div id="admin-login-error" class="hint error"></div>
      <button id="admin-login-submit" class="btn-primary">Login</button>
      <button id="admin-login-back" class="link-button" type="button">Back to check-in</button>
    </div>
  </div>

  <div id="admin-panel-overlay" class="modal-overlay admin-overlay" hidden>
    <div class="modal-card admin-panel-card" id="admin-panel-content"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/geology.js"></script>
  <script src="js/work-item-schema.js"></script>
  <script src="js/db.js"></script>
  <script src="js/exif.js"></script>
  <script src="js/srt-parser.js"></script>
  <script src="js/sheets-api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
