<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Site Survey Mapper</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <button class="brand" id="brand-button" title="Edit your name / project">
      <img class="brand-logo" src="assets/logo-aoa.png" alt="Age of Aquarius India Developers LLP" />
      <span class="brand-title">Site Survey Mapper</span>
    </button>
    <div class="header-right">
      <button id="sync-badge" class="sync-badge ok" title="Sync status">✓ Synced</button>
      <img class="partner-logo" src="assets/logo-dmlrd.png" alt="DMLRD Tech" onerror="this.style.display='none'" />
    </div>
  </header>

  <main id="view-root"></main>

  <nav class="bottom-nav">
    <button data-view="dashboard" class="active"><span class="icon">🗺️</span><span>Map</span></button>
    <button data-view="new-entry" class="fab"><span class="icon">＋</span><span>New</span></button>
    <button data-view="sync"><span class="icon">⇅</span><span>Sync</span></button>
  </nav>

  <div id="whoareyou-overlay" class="modal-overlay" hidden>
    <div class="modal-card">
      <h2>Who are you?</h2>
      <p class="modal-sub">This is stamped on every record you capture.</p>
      <div class="field-group">
        <label>Engineer name</label>
        <input id="way-engineer" type="text" placeholder="Your name" />
      </div>
      <div class="field-group">
        <label>Project / site name</label>
        <input id="way-project" type="text" placeholder="e.g. Purandar Site — Plot 4" />
      </div>
      <button id="way-save" class="btn-primary">Continue</button>
      <button id="way-skip" class="btn-secondary">Skip for now</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/geology.js"></script>
  <script src="js/work-item-schema.js"></script>
  <script src="js/db.js"></script>
  <script src="js/exif.js"></script>
  <script src="js/srt-parser.js"></script>
  <script src="js/sheets-api.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
